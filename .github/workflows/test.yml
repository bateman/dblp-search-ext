name: Unit Tests

# Called by every release workflow, so nothing is published unless the
# unit tests pass on the tagged commit. Also runs on pull requests and on
# pushes to main (which include merged pull requests).
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

# The tests only need to read the code
permissions:
  contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm test

            # manifest.json serves every browser; web-ext catches a manifest
            # that Firefox would reject before any release workflow uploads it
            - name: Lint Firefox addon
              run: make test/lint
